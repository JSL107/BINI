name: refresh-images

on:
  schedule:
    # UTC '30 0 * * *' = 매일 09:30 KST. refresh-jobs 오전 실행(09:00 KST) 직후라 새 공고의
    # 검색어가 반영되고, DB가 깨어 있는 시간대를 한 번으로 모은다.
    - cron: '30 0 * * *'
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 크롤러마다 시간 예산(*_TIME_BUDGET_MS)으로 스스로 멈춘다: 이미지 15분 + 나무위키 10분
    # + 사람인 ≤50건(~8분) + 만료 처리. 예산이 먼저 끊도록 timeout은 그보다 넉넉히.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile=false

      - name: Install Chromium
        run: pnpm --filter crawler exec playwright install --with-deps chromium

      - name: Run image crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRAWLER_MAX_QUERIES: '500'
          CRAWLER_TIME_BUDGET_MS: '900000'
        run: pnpm --filter crawler crawl

      # 앞 단계가 실패해도 뒤 단계는 독립적으로 실행 (취소된 경우만 제외).
      - name: Run namuwiki crawler
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NAMUWIKI_MAX_TARGETS: '300'
          NAMUWIKI_TIME_BUDGET_MS: '600000'
        run: pnpm --filter crawler crawl:namuwiki

      - name: Run saramin detail enrichment
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SARAMIN_MAX_TARGETS: '50'
        run: pnpm --filter crawler crawl:saramin

      - name: Mark expired jobs
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter crawler expire
